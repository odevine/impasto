name: release-please

# Automated versioning. release-please reads Conventional Commit messages on
# main and opens a release PR that bumps the version and updates CHANGELOG.md.
# Merging that PR tags the release (e.g. v0.2.0) and creates a GitHub Release.
# For a Go library the tag is the version, so downstream users pin to it.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

name: Dependabot auto-merge

# Enables auto-merge on Dependabot PRs so green dependency bumps merge
# themselves. Auto-merge only completes once the required status checks from
# branch protection pass, so CI is the safety gate. Merges are squashed to keep
# main history linear.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Auto-merge every Dependabot update. Today those are GitHub Actions bumps
      # (pinned by major tag, so they arrive as majors) that CI validates. If Go
      # module dependencies are added later and majors should be reviewed by
      # hand, guard this step with:
      #   steps.metadata.outputs.update-type != 'version-update:semver-major'
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
